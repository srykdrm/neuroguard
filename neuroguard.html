<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroGuard Log</title>
    <!-- Tailwind CSS for clean dark UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: {} }
        }
    </script>
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#030712">
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen p-4 flex flex-col items-center">

    <div class="w-full max-w-md bg-gray-900 border border-gray-800 rounded-xl p-5 shadow-xl mb-8">
        <header class="mb-5 border-b border-gray-800 pb-3 flex justify-between items-center">
            <h1 class="text-lg font-bold tracking-wider text-emerald-400"># NeuroGuard Log</h1>
            <!-- 日付入力項目 -->
            <div class="flex items-center space-x-1">
                <span class="text-xs text-gray-400">日付:</span>
                <input type="date" id="log-date" class="bg-gray-800 text-xs text-emerald-400 px-2 py-1 rounded border border-gray-700 focus:outline-none focus:border-emerald-500">
            </div>
        </header>

        <form id="log-form" class="space-y-4">
            
            <!-- 0. ライフスタイル（勤務状態） -->
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider mb-2 text-gray-400">0. ライフスタイル</label>
                <div class="grid grid-cols-3 gap-2 text-sm" id="lifestyle-group">
                    <button type="button" data-val="office" class="life-btn py-2 rounded bg-emerald-600 font-bold transition text-center text-white">出社</button>
                    <button type="button" data-val="remote" class="life-btn py-2 rounded bg-gray-800 hover:bg-emerald-600 transition text-center">在宅勤務</button>
                    <button type="button" data-val="holiday" class="life-btn py-2 rounded bg-gray-800 hover:bg-emerald-600 transition text-center">休日</button>
                </div>
            </div>

            <!-- 1. お薬の服用状況（緩和要素） -->
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider mb-2 text-gray-400">1. 服用状況（緩和）</label>
                <div class="space-y-2 text-sm">
                    <div class="flex items-center justify-between bg-gray-800 p-2 rounded-lg">
                        <span class="text-gray-300">メイラックス</span>
                        <div class="space-x-1" id="mex-group">
                            <button type="button" data-val="0" class="med-btn-mex px-2.5 py-1 rounded bg-gray-700 transition">0</button>
                            <button type="button" data-val="0.5" class="med-btn-mex px-2.5 py-1 rounded bg-gray-700 transition">0.5</button>
                            <button type="button" data-val="1.0" class="med-btn-mex px-2.5 py-1 rounded bg-emerald-600 font-bold text-white transition">1.0</button>
                        </div>
                    </div>
                    <div class="flex items-center justify-between bg-gray-800 p-2 rounded-lg">
                        <span class="text-gray-300">ソラナックス</span>
                        <div class="space-x-1" id="sol-group">
                            <button type="button" data-val="0" class="med-btn-sol px-2.5 py-1 rounded bg-emerald-600 font-bold text-white transition">0</button>
                            <button type="button" data-val="0.5" class="med-btn-sol px-2.5 py-1 rounded bg-gray-700 transition">0.5</button>
                            <button type="button" data-val="1.0" class="med-btn-sol px-2.5 py-1 rounded bg-gray-700 transition">1.0</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 2. ストレスイベント（マイナス要素） -->
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider mb-2 text-gray-400">2. ストレスイベント（マイナス）</label>
                <div class="grid grid-cols-3 gap-2 text-sm">
                    <label class="flex items-center space-x-2 bg-gray-800 p-2.5 rounded-lg cursor-pointer">
                        <input type="checkbox" id="evt-none" class="rounded bg-gray-700 text-emerald-500 focus:ring-0">
                        <span>無し</span>
                    </label>
                    <label class="flex items-center space-x-2 bg-gray-800 p-2.5 rounded-lg cursor-pointer">
                        <input type="checkbox" id="evt-meeting" class="rounded bg-gray-700 text-emerald-500 focus:ring-0">
                        <span>打ち合わせ</span>
                    </label>
                    <label class="flex items-center space-x-2 bg-gray-800 p-2.5 rounded-lg cursor-pointer">
                        <input type="checkbox" id="evt-trip" class="rounded bg-gray-700 text-emerald-500 focus:ring-0">
                        <span>出張</span>
                    </label>
                </div>
            </div>

            <!-- 3. 身体反応（マイナス要素 + 疲労感の5段階評価） -->
            <div class="space-y-3">
                <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400">3. 身体反応（マイナス）</label>
                <div class="grid grid-cols-2 gap-2 text-sm">
                    <label class="flex items-center space-x-2 bg-gray-800 p-2.5 rounded-lg cursor-pointer">
                        <input type="checkbox" id="sym-throat" class="rounded bg-gray-700 text-emerald-500 focus:ring-0">
                        <span>喉のつかえ感</span>
                    </label>
                    <label class="flex items-center space-x-2 bg-gray-800 p-2.5 rounded-lg cursor-pointer">
                        <input type="checkbox" id="sym-diarrhea" class="rounded bg-gray-700 text-emerald-500 focus:ring-0">
                        <span>下痢の有無</span>
                    </label>
                </div>
                
                <!-- 疲労感 5段階評価 -->
                <div class="bg-gray-800/50 p-3 rounded-xl border border-gray-800">
                    <label class="block text-xs text-gray-300 mb-2 font-semibold">疲労感レベル (1〜5)</label>
                    <div class="grid grid-cols-5 gap-2" id="fatigue-group">
                        <button type="button" data-val="1" class="fat-btn py-1.5 rounded bg-emerald-600 font-bold text-white transition text-center text-sm">1</button>
                        <button type="button" data-val="2" class="fat-btn py-1.5 rounded bg-gray-800 hover:bg-emerald-600 transition text-center text-sm">2</button>
                        <button type="button" data-val="3" class="fat-btn py-1.5 rounded bg-gray-800 hover:bg-emerald-600 transition text-center text-sm">3</button>
                        <button type="button" data-val="4" class="fat-btn py-1.5 rounded bg-gray-800 hover:bg-emerald-600 transition text-center text-sm">4</button>
                        <button type="button" data-val="5" class="fat-btn py-1.5 rounded bg-gray-800 hover:bg-emerald-600 transition text-center text-sm">5</button>
                    </div>
                </div>
            </div>

            <!-- 4. 結果：その日の締めくくりの不安レベル (1〜5) -->
            <div class="bg-gray-800/50 p-3 rounded-xl border border-gray-800">
                <label class="block text-xs font-semibold uppercase tracking-wider mb-2 text-emerald-400">4. 【結果】今日の締めくくり不安レベル (1〜5)</label>
                <div class="grid grid-cols-5 gap-2" id="anxiety-group">
                    <button type="button" data-val="1" class="anx-btn py-2 rounded bg-gray-800 hover:bg-emerald-600 transition text-center font-bold">1</button>
                    <button type="button" data-val="2" class="anx-btn py-2 rounded bg-gray-800 hover:bg-emerald-600 transition text-center font-bold">2</button>
                    <button type="button" data-val="3" class="anx-btn py-2 rounded bg-emerald-600 transition text-center font-bold text-white shadow-lg">3</button>
                    <button type="button" data-val="4" class="anx-btn py-2 rounded bg-gray-800 hover:bg-emerald-600 transition text-center font-bold">4</button>
                    <button type="button" data-val="5" class="anx-btn py-2 rounded bg-gray-800 hover:bg-emerald-600 transition text-center font-bold">5</button>
                </div>
                <div class="flex justify-between text-[10px] text-gray-400 mt-1 px-1">
                    <span>1: 平穏</span>
                    <span>3: ざわつき</span>
                    <span>5: 発作・激痛</span>
                </div>
            </div>

            <!-- 保存ボタン -->
            <button type="submit" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 font-bold rounded-xl transition shadow-lg tracking-wider text-sm">
                因果関係ログを保存する
            </button>
        </form>

        <!-- カレンダービュー表示エリア -->
        <div class="mt-8 border-t border-gray-800 pt-4">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Log Calendar & Prediction</h2>
                <div class="flex items-center space-x-2">
                    <button type="button" id="prev-month" class="px-2 py-1 bg-gray-800 hover:bg-gray-700 rounded text-xs text-gray-300">&lt;</button>
                    <span id="calendar-title" class="text-xs font-bold text-emerald-400"></span>
                    <button type="button" id="next-month" class="px-2 py-1 bg-gray-800 hover:bg-gray-700 rounded text-xs text-gray-300">&gt;</button>
                </div>
            </div>
            
            <div class="grid grid-cols-7 gap-1 text-center text-[10px] text-gray-400 mb-1">
                <div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div>
            </div>
            <div id="calendar-grid" class="grid grid-cols-7 gap-1 text-xs"></div>
        </div>

        <!-- 詳細／予測表示エリア -->
        <div id="day-detail" class="mt-4 bg-gray-800/60 p-3 rounded-xl border border-gray-800 text-xs text-gray-300 hidden"></div>
    </div>

    <!-- JSロジック -->
    <script>
        let state = {
            lifestyle: 'office',
            mexazolam: 1.0,
            solaxin: 0.0,
            fatigueLevel: 1,
            finalAnxietyLevel: 3
        };

        let currentCalendarDate = new Date();
        const todayStr = new Date().toISOString().split('T')[0];
        document.getElementById('log-date').value = todayStr;

        function setupButtonGroup(containerId, btnClass, stateKey, isFloat = true) {
            const container = document.getElementById(containerId);
            container.querySelectorAll('.' + btnClass).forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const targetBtn = e.currentTarget;
                    container.querySelectorAll('.' + btnClass).forEach(b => {
                        b.classList.remove('bg-emerald-600', 'font-bold', 'text-white');
                        b.classList.add('bg-gray-800', 'hover:bg-emerald-600');
                    });
                    targetBtn.classList.remove('bg-gray-800', 'hover:bg-emerald-600', 'bg-gray-700');
                    targetBtn.classList.add('bg-emerald-600', 'font-bold', 'text-white');
                    state[stateKey] = isFloat ? parseFloat(targetBtn.dataset.val) : parseInt(targetBtn.dataset.val);
                });
            });
        }

        function setupSingleGroup(containerId, btnClass, stateKey) {
            const container = document.getElementById(containerId);
            container.querySelectorAll('.' + btnClass).forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const targetBtn = e.currentTarget;
                    container.querySelectorAll('.' + btnClass).forEach(b => {
                        b.classList.remove('bg-emerald-600', 'font-bold', 'text-white');
                        b.classList.add('bg-gray-800');
                    });
                    targetBtn.classList.remove('bg-gray-800');
                    targetBtn.classList.add('bg-emerald-600', 'font-bold', 'text-white');
                    state[stateKey] = targetBtn.dataset.val;
                });
            });
        }

        setupSingleGroup('lifestyle-group', 'life-btn', 'lifestyle');
        setupButtonGroup('mex-group', 'med-btn-mex', 'mexazolam', true);
        setupButtonGroup('sol-group', 'med-btn-sol', 'solaxin', true);
        setupButtonGroup('fatigue-group', 'fat-btn', 'fatigueLevel', false);
        
        const anxButtons = document.querySelectorAll('.anx-btn');
        anxButtons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                const targetBtn = e.currentTarget;
                anxButtons.forEach(b => {
                    b.classList.remove('bg-emerald-600', 'text-white', 'shadow-lg');
                    b.classList.add('bg-gray-800');
                });
                targetBtn.classList.remove('bg-gray-800');
                targetBtn.classList.add('bg-emerald-600', 'text-white', 'shadow-lg');
                state.finalAnxietyLevel = parseInt(targetBtn.dataset.val);
            });
        });

        document.getElementById('log-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const selectedDate = document.getElementById('log-date').value;

            const newLog = {
                id: Date.now(),
                date: selectedDate,
                lifestyle: state.lifestyle,
                mitigations: {
                    mexazolam: state.mexazolam,
                    solaxin: state.solaxin
                },
                causes: {
                    stressEvents: {
                        none: document.getElementById('evt-none').checked,
                        meeting: document.getElementById('evt-meeting').checked,
                        trip: document.getElementById('evt-trip').checked
                    },
                    physicalSymptoms: {
                        throatTightness: document.getElementById('sym-throat').checked,
                        diarrhea: document.getElementById('sym-diarrhea').checked,
                        fatigueLevel: state.fatigueLevel
                    }
                },
                result: {
                    finalAnxietyLevel: state.finalAnxietyLevel
                }
            };

            let logs = JSON.parse(localStorage.getItem('neuroguard_logs_v3') || '[]');
            const existingIndex = logs.findIndex(l => l.date === selectedDate);
            if (existingIndex >= 0) {
                logs[existingIndex] = newLog;
            } else {
                logs.unshift(newLog);
            }

            localStorage.setItem('neuroguard_logs_v3', JSON.stringify(logs));
            alert(`[${selectedDate}] の因果関係ログを保存しました。`);
            renderCalendar();
        });

        function renderCalendar() {
            const gridEl = document.getElementById('calendar-grid');
            const titleEl = document.getElementById('calendar-title');
            gridEl.innerHTML = '';

            const year = currentCalendarDate.getFullYear();
            const month = currentCalendarDate.getMonth();
            titleEl.textContent = `${year}年 ${month + 1}月`;

            const logs = JSON.parse(localStorage.getItem('neuroguard_logs_v3') || '[]');
            const logMap = {};
            logs.forEach(l => { logMap[l.date] = l; });

            const firstDayIndex = new Date(year, month, 1).getDay();
            const lastDayDate = new Date(year, month + 1, 0).getDate();

            for (let i = 0; i < firstDayIndex; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = 'h-9 bg-gray-900/40 rounded';
                gridEl.appendChild(emptyCell);
            }

            for (let day = 1; day <= lastDayDate; day++) {
                const mm = String(month + 1).padStart(2, '0');
                const dd = String(day).padStart(2, '0');
                const dateStr = `${year}-${mm}-${dd}`;

                const cell = document.createElement('div');
                cell.className = 'h-9 rounded flex flex-col items-center justify-center cursor-pointer transition relative border border-gray-800 bg-gray-800/80 hover:border-emerald-500';
                
                const log = logMap[dateStr];
                const isFuture = dateStr > todayStr;

                let indicatorColor = 'bg-gray-700 text-gray-300';
                if (log) {
                    if (log.result.finalAnxietyLevel <= 2) indicatorColor = 'bg-emerald-600 text-white font-bold';
                    else if (log.result.finalAnxietyLevel === 3) indicatorColor = 'bg-amber-600 text-white font-bold';
                    else indicatorColor = 'bg-rose-600 text-white font-bold';
                } else if (isFuture) {
                    indicatorColor = 'bg-blue-900/50 text-blue-300 border border-blue-700/50';
                }

                cell.innerHTML = `
                    <span class="text-[10px] text-gray-400">${day}</span>
                    <div class="w-5 h-5 rounded-full flex items-center justify-center text-[10px] ${log ? indicatorColor : (isFuture ? 'bg-blue-900/60 text-blue-300 font-semibold text-[9px]' : 'text-500')}">
                        ${log ? log.result.finalAnxietyLevel : (isFuture ? '予' : '-')}
                    </div>
                `;

                cell.addEventListener('click', () => {
                    if (isFuture) {
                        showPredictionModal(dateStr);
                    } else {
                        showDayDetail(dateStr, log);
                    }
                });

                gridEl.appendChild(cell);
            }
        }

        // 過去日の詳細表示
        function showDayDetail(dateStr, log) {
            const detailEl = document.getElementById('day-detail');
            detailEl.classList.remove('hidden');

            if (!log) {
                detailEl.innerHTML = `<span class="text-gray-400">${dateStr} の記録はありません。</span> <button onclick="document.getElementById('log-date').value='${dateStr}'; window.scrollTo({top:0, behavior:'smooth'});" class="text-emerald-400 underline ml-2">この日を入力する</button>`;
                return;
            }

            const lifeMap = { office: '出社', remote: '在宅', holiday: '休日' };
            let events = [];
            if (log.causes.stressEvents.none) events.push('無し');
            if (log.causes.stressEvents.meeting) events.push('打ち合わせ');
            if (log.causes.stressEvents.trip) events.push('出張');

            let symptoms = [];
            if (log.causes.physicalSymptoms.throatTightness) symptoms.push('喉つかえ');
            if (log.causes.physicalSymptoms.diarrhea) symptoms.push('下痢');

            detailEl.innerHTML = `
                <div class="flex justify-between items-center mb-1 border-b border-gray-700 pb-1">
                    <span class="font-bold text-emerald-400">${log.date} の記録</span>
                    <span class="text-[10px] bg-gray-700 px-1.5 py-0.5 rounded">${lifeMap[log.lifestyle]}</span>
                </div>
                <div class="grid grid-cols-2 gap-1 text-[11px] text-gray-300">
                    <div>不安Lv: <span class="text-white font-bold">${log.result.finalAnxietyLevel}</span></div>
                    <div>疲労Lv: <span class="text-white font-bold">${log.causes.physicalSymptoms.fatigueLevel}</span></div>
                    <div>服薬: メイ:${log.mitigations.mexazolam} / ソラ:${log.mitigations.solaxin}</div>
                    <div>イベント: ${events.join(', ')}</div>
                    <div class="col-span-2">身体反応: ${symptoms.length ? symptoms.join(', ') : '特になし'}</div>
                </div>
                <div class="mt-2 text-right">
                    <button onclick="document.getElementById('log-date').value='${dateStr}'; window.scrollTo({top:0, behavior:'smooth'});" class="text-[10px] text-emerald-400 underline">この日のデータを修正する</button>
                </div>
            `;
        }

        // 未来日の予測シミュレーター表示
        function showPredictionModal(dateStr) {
            const detailEl = document.getElementById('day-detail');
            detailEl.classList.remove('hidden');

            detailEl.innerHTML = `
                <div class="border-b border-blue-800/60 pb-2 mb-2 flex justify-between items-center">
                    <span class="font-bold text-blue-400">🔮 ${dateStr} の未来予測シミュレーション</span>
                    <span class="text-[10px] bg-blue-900/60 text-blue-200 px-1.5 py-0.5 rounded">予測モード</span>
                </div>
                <p class="text-[11px] text-gray-300 mb-3">この日の予定仮説を入力すると、過去ログから予測される不安レベルを算出します。</p>
                
                <div class="space-y-2 mb-3 bg-gray-900/50 p-2 rounded">
                    <div class="flex justify-between items-center text-[11px]">
                        <span>予定ライフスタイル:</span>
                        <select id="pred-life" class="bg-gray-800 text-emerald-400 px-2 py-0.5 rounded border border-gray-700">
                            <option value="office">出社</option>
                            <option value="remote">在宅勤務</option>
                            <option value="holiday">休日</option>
                        </select>
                    </div>
                    <div class="flex justify-between items-center text-[11px]">
                        <span>打ち合わせ予定:</span>
                        <label class="flex items-center space-x-1 cursor-pointer">
                            <input type="checkbox" id="pred-meeting" class="rounded bg-gray-800 text-emerald-500">
                            <span>あり</span>
                        </label>
                    </div>
                    <div class="flex justify-between items-center text-[11px]">
                        <span>メイラックス予定:</span>
                        <select id="pred-mex" class="bg-gray-800 text-emerald-400 px-2 py-0.5 rounded border border-gray-700">
                            <option value="1.0">1.0錠</option>
                            <option value="0.5">0.5錠</option>
                            <option value="0">0錠</option>
                        </select>
                    </div>
                </div>

                <button type="button" onclick="calculateAndShowPrediction('${dateStr}')" class="w-full py-1.5 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded text-xs transition">
                    過去ログから予測を計算する
                </button>
                <div id="pred-result-area" class="mt-2"></div>
            `;
        }

        // 予測の計算ロジック
        function calculateAndShowPrediction(dateStr) {
            const life = document.getElementById('pred-life').value;
            const hasMeeting = document.getElementById('pred-meeting').checked;
            const mex = parseFloat(document.getElementById('pred-mex').value);

            const logs = JSON.parse(localStorage.getItem('neuroguard_logs_v3') || '[]');

            // 類似条件のログを抽出
            const matched = logs.filter(l => {
                const sameLife = l.lifestyle === life;
                const matchMeeting = l.causes.stressEvents.meeting === hasMeeting;
                return sameLife && matchMeeting;
            });

            const resultArea = document.getElementById('pred-result-area');

            if (matched.length === 0) {
                resultArea.innerHTML = `<div class="mt-2 p-2 bg-gray-900 rounded text-amber-400 text-[11px]">⚠️ 該当する過去の類似データがまだありません。まずは数日分のログを蓄積してください。</div>`;
                return;
            }

            // 平均不安レベル算出
            const avg = matched.reduce((sum, l) => sum + l.result.finalAnxietyLevel, 0) / matched.length;
            let adjusted = avg;
            if (mex >= 1.0) adjusted -= 0.5;

            const predictedLevel = Math.max(1, Math.min(5, Math.round(adjusted)));

            let advice = "平穏に過ごせる確率が高い状態です。通常稼働でOKです。";
            let colorClass = "text-emerald-400 bg-emerald-950/40 border-emerald-800";
            if (predictedLevel >= 3 && predictedLevel < 4) {
                advice = "ややざわつきやすい条件です。10分放置の構えと深呼吸を意識してください。";
                colorClass = "text-amber-400 bg-amber-950/40 border-amber-800";
            } else if (predictedLevel >= 4) {
                advice = "アラーム過敏リスクが高めです。事前の服薬管理と、『20点でOK』の心構えを推奨します。";
                colorClass = "text-rose-400 bg-rose-950/40 border-rose-800";
            }

            resultArea.innerHTML = `
                <div class="mt-2 p-2.5 rounded border ${colorClass} text-[11px] space-y-1">
                    <div class="font-bold">🎯 予測される最終不安レベル: Lv.${predictedLevel}</div>
                    <div class="text-gray-300">💡 対策アドバイス: ${advice}</div>
                    <div class="text-[10px] text-gray-400 mt-1">（類似の過去データ ${matched.length} 件を解析）</div>
                </div>
            `;
        }

        document.getElementById('prev-month').addEventListener('click', () => {
            currentCalendarDate.setMonth(currentCalendarDate.getMonth() - 1);
            renderCalendar();
        });
        document.getElementById('next-month').addEventListener('click', () => {
            currentCalendarDate.setMonth(currentCalendarDate.getMonth() + 1);
            renderCalendar();
        });

        renderCalendar();
    </script>
</body>
</html>
