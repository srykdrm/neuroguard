<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroGuard Log v3.3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; }
    </style>
</head>
<body class="p-4 sm:p-6 max-w-4xl mx-auto pb-20">

    <!-- ヘッダー -->
    <header class="mb-6 flex justify-between items-center border-b border-slate-800 pb-4">
        <div>
            <h1 class="text-xl font-bold text-emerald-400">NeuroGuard Log <span class="text-xs bg-emerald-950 text-emerald-300 px-2 py-0.5 rounded border border-emerald-800">v3.3 (月曜始まり)</span></h1>
            <p class="text-xs text-slate-400">パニック・不安障害 ＆ IBS因果関係予測カレンダー</p>
        </div>
    </header>

    <!-- 1. ログ入力・未来予定編集フォーム -->
    <section class="bg-slate-900 border border-slate-800 rounded-xl p-5 mb-6 shadow-lg">
        <h2 id="form-title" class="text-sm font-semibold text-slate-300 mb-4 flex items-center gap-2">
            📝 日々のログ記録 / 未来予定の登録
        </h2>
        <form id="log-form" class="space-y-4">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">日付</label>
                    <input type="date" id="log-date" class="w-full bg-slate-800 border border-slate-700 rounded px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-emerald-500" required>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">ライフイベント・予定</label>
                    <select id="log-lifestyle" class="w-full bg-slate-800 border border-slate-700 rounded px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-emerald-500">
                        <option value="remote">💻 リモートワーク</option>
                        <option value="holiday">🌴 休日・オフ</option>
                        <option value="office">🏢 通常出社</option>
                        <option value="event">🔥 大事なイベント・外出</option>
                    </select>
                </div>
            </div>

            <!-- 不安・IBS下痢レベル -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 border-t border-slate-800 pt-3">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">不安レベル (1:安心 〜 5:強い不安)</label>
                    <input type="range" id="log-anxiety" min="1" max="5" value="2" class="w-full accent-emerald-500" oninput="document.getElementById('anxiety-val').innerText = this.value">
                    <div class="text-right text-xs text-emerald-400 font-bold"><span id="anxiety-val">2</span> / 5</div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">下痢の強度 (1:なし 〜 5:激しい)</label>
                    <input type="range" id="log-diarrhea" min="1" max="5" value="1" class="w-full accent-rose-500" oninput="document.getElementById('diarrhea-val').innerText = this.value">
                    <div class="text-right text-xs text-rose-400 font-bold"><span id="diarrhea-val">1</span> / 5</div>
                </div>
            </div>

            <!-- 服薬チェック -->
            <div class="border-t border-slate-800 pt-3">
                <label class="block text-xs font-medium text-slate-400 mb-2">服薬実績（未来日の場合は服用予定）</label>
                <div class="grid grid-cols-3 gap-2">
                    <label class="flex items-center gap-2 bg-slate-800 p-2 rounded border border-slate-700 cursor-pointer text-xs">
                        <input type="checkbox" id="log-med-anxiety" class="accent-emerald-500 rounded" checked>
                        <span>💊 精神安定剤</span>
                    </label>
                    <label class="flex items-center gap-2 bg-slate-800 p-2 rounded border border-slate-700 cursor-pointer text-xs">
                        <input type="checkbox" id="log-med-kampo" class="accent-emerald-500 rounded" checked>
                        <span>🌿 漢方薬</span>
                    </label>
                    <label class="flex items-center gap-2 bg-slate-800 p-2 rounded border border-slate-700 cursor-pointer text-xs">
                        <input type="checkbox" id="log-med-probiotics" class="accent-emerald-500 rounded" checked>
                        <span>🧪 整腸剤</span>
                    </label>
                </div>
            </div>

            <button type="submit" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-medium rounded-lg text-sm transition shadow-md">
                データを保存してカレンダー更新
            </button>
        </form>
    </section>

    <!-- 2. カレンダービュー (月曜始まり) -->
    <section class="bg-slate-900 border border-slate-800 rounded-xl p-5 mb-6 shadow-lg">
        <div class="flex justify-between items-center mb-3">
            <h2 class="text-sm font-semibold text-slate-300 flex items-center gap-2">
                📅 予測・実績カレンダー
            </h2>
            <div class="flex items-center gap-2">
                <button onclick="changeMonth(-1)" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded text-xs">&lt; 前月</button>
                <span id="cal-month-title" class="text-xs font-bold text-emerald-400 min-w-[70px] text-center">2026/10</span>
                <button onclick="changeMonth(1)" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded text-xs">翌月 &gt;</button>
            </div>
        </div>

        <!-- 凡例 -->
        <div class="flex gap-4 text-[11px] text-slate-400 mb-3 bg-slate-950 p-2 rounded border border-slate-800/80">
            <div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-emerald-500 inline-block"></span> 実績ログ</div>
            <div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full border border-dashed border-amber-400 bg-amber-950/40 inline-block"></span> 🔮向こう1週間の自動予測</div>
        </div>

        <!-- カレンダーヘッダー（月曜始まり） -->
        <div class="grid grid-cols-7 gap-1 text-center text-[10px] text-slate-400 mb-2">
            <div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div class="text-blue-400">土</div><div class="text-rose-400">日</div>
        </div>
        <div id="calendar-grid" class="grid grid-cols-7 gap-1.5">
            <!-- 動的生成 -->
        </div>
    </section>

    <!-- 3. データ管理 -->
    <section class="border-t border-slate-800 pt-5">
        <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">データ管理・バックアップ</h3>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
            <button type="button" onclick="exportData()" class="py-2 px-3 bg-slate-800 hover:bg-slate-700 text-emerald-400 font-medium rounded text-xs transition border border-slate-700 flex items-center justify-center gap-1">
                📥 バックアップ出力 (JSON)
            </button>
            <label class="py-2 px-3 bg-slate-800 hover:bg-slate-700 text-blue-400 font-medium rounded text-xs transition border border-slate-700 flex items-center justify-center gap-1 cursor-pointer">
                📤 バックアップ復元
                <input type="file" id="import-file" accept=".json" class="hidden" onchange="importData(event)">
            </label>
            <button type="button" onclick="clearAllData()" class="py-2 px-3 bg-rose-950/40 hover:bg-rose-900/60 text-rose-400 font-medium rounded text-xs transition border border-rose-800/60 flex items-center justify-center gap-1">
                🗑️ ログ全削除
            </button>
        </div>
    </section>

    <!-- JavaScript ロジック -->
    <script>
        const STORAGE_KEY = 'neuroguard_logs_v3';
        let currentYear = new Date().getFullYear();
        let currentMonth = new Date().getMonth(); // 0-indexed

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('log-date').value = getTodayStr();
            renderCalendar();
        });

        function getTodayStr() {
            const today = new Date();
            return today.toISOString().split('T')[0];
        }

        // フォーム送信
        document.getElementById('log-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const date = document.getElementById('log-date').value;
            const newLog = {
                date,
                lifestyle: document.getElementById('log-lifestyle').value,
                finalAnxietyLevel: Number(document.getElementById('log-anxiety').value),
                diarrheaSeverity: Number(document.getElementById('log-diarrhea').value),
                anxietyMedTaken: document.getElementById('log-med-anxiety').checked,
                kampoIntake: document.getElementById('log-med-kampo').checked ? 1 : 0,
                probioticsIntake: document.getElementById('log-med-probiotics').checked ? 1 : 0
            };

            let logs = getStoredLogs();
            const idx = logs.findIndex(l => l.date === date);
            if (idx >= 0) { logs[idx] = newLog; } else { logs.unshift(newLog); }
            
            saveLogs(logs);
            alert(`[${date}] のデータを保存しました。`);
            renderCalendar();
        });

        function changeMonth(direction) {
            currentMonth += direction;
            if (currentMonth > 11) { currentMonth = 0; currentYear++; }
            else if (currentMonth < 0) { currentMonth = 11; currentYear--; }
            renderCalendar();
        }

        // 未来1週間（向こう7日間）の予測計算
        function predictForDate(targetDateStr, logs) {
            const targetDate = new Date(targetDateStr);
            const today = new Date(getTodayStr());

            const pastLogs = logs.filter(l => new Date(l.date) <= today).slice(0, 7);
            
            let avgAnxiety = 2.0, avgDiarrhea = 1.5;
            if (pastLogs.length > 0) {
                avgAnxiety = pastLogs.reduce((s, l) => s + (l.finalAnxietyLevel || 2), 0) / pastLogs.length;
                avgDiarrhea = pastLogs.reduce((s, l) => s + (l.diarrheaSeverity || 1), 0) / pastLogs.length;
            }

            const dayConfig = logs.find(l => l.date === targetDateStr) || {};
            const lifestyle = dayConfig.lifestyle || 'office';
            const takeAnxietyMed = dayConfig.anxietyMedTaken !== undefined ? dayConfig.anxietyMedTaken : true;
            const takeKampo = dayConfig.kampoIntake !== undefined ? (dayConfig.kampoIntake === 1) : true;
            const takeProbiotics = dayConfig.probioticsIntake !== undefined ? (dayConfig.probioticsIntake === 1) : true;

            let eventPenalty = (lifestyle === 'event') ? 0.8 : (lifestyle === 'office') ? 0.4 : 0.1;
            let anxietyRelief = takeAnxietyMed ? 1.0 : 0;
            let kampoRelief = takeKampo ? 0.7 : 0;
            let probioticsRelief = takeProbiotics ? 0.5 : 0;

            let predAnxiety = Math.max(1, Math.min(5, Math.round(avgAnxiety + eventPenalty - anxietyRelief)));
            let rawDiarrhea = avgDiarrhea + (eventPenalty * 0.7) + ((predAnxiety - 2) * 0.3) - kampoRelief - probioticsRelief;
            let predDiarrhea = Math.max(1, Math.min(5, Math.round(rawDiarrhea)));

            return { predAnxiety, predDiarrhea, lifestyle };
        }

        // カレンダー描画（月曜始まりロジック）
        function renderCalendar() {
            const logs = getStoredLogs();
            const logMap = {};
            logs.forEach(l => { logMap[l.date] = l; });

            const todayStr = getTodayStr();
            const todayObj = new Date(todayStr);
            const sevenDaysLater = new Date(todayObj);
            sevenDaysLater.setDate(todayObj.getDate() + 7);

            document.getElementById('cal-month-title').innerText = `${currentYear}/${String(currentMonth + 1).padStart(2, '0')}`;
            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = '';

            // 月曜始まりのオフセット計算
            // JSの getDay() は 0:日, 1:月, 2:火... 6:土
            // 月曜始まりにするため (day + 6) % 7 に変換 (月:0, 火:1, ..., 日:6)
            const firstDayRaw = new Date(currentYear, currentMonth, 1).getDay();
            const firstDayIndex = (firstDayRaw + 6) % 7; 
            const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();

            // 前月の余白
            for (let i = 0; i < firstDayIndex; i++) {
                grid.innerHTML += `<div class="bg-slate-950/40 rounded p-1 h-16 opacity-30"></div>`;
            }

            // 日付セル生成
            for (let d = 1; d <= totalDays; d++) {
                const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                const cellDate = new Date(dateStr);
                const log = logMap[dateStr];

                let bgClass = "bg-slate-950 border-slate-800";
                let content = `<div class="text-[10px] text-slate-400 font-bold">${d}</div>`;

                if (log && cellDate <= todayObj) {
                    bgClass = "bg-slate-900 border-emerald-600/80";
                    content = `
                        <div class="flex justify-between items-center text-[10px] font-bold text-emerald-400">
                            <span>${d}</span>
                            <span class="text-[8px] bg-emerald-950 text-emerald-300 px-1 rounded">済</span>
                        </div>
                        <div class="text-[9px] text-emerald-300 font-semibold mt-0.5">安:${log.finalAnxietyLevel} 下:${log.diarrheaSeverity}</div>
                        <div class="text-[8px] text-slate-400 truncate">${getLifeLabel(log.lifestyle)}</div>
                    `;
                } 
                else if (cellDate > todayObj && cellDate <= sevenDaysLater) {
                    const pred = predictForDate(dateStr, logs);
                    bgClass = "bg-amber-950/20 border-dashed border-amber-500/70";
                    content = `
                        <div class="flex justify-between items-center text-[10px] font-bold text-amber-300">
                            <span>${d}</span>
                            <span class="text-[8px] text-amber-400">🔮予測</span>
                        </div>
                        <div class="text-[9px] text-amber-200 font-semibold mt-0.5">安:${pred.predAnxiety} 下:${pred.predDiarrhea}</div>
                        <div class="text-[8px] text-amber-400/80 truncate">${getLifeLabel(pred.lifestyle)}</div>
                    `;
                }

                grid.innerHTML += `
                    <div onclick="selectDate('${dateStr}')" class="${bgClass} border rounded p-1 h-16 cursor-pointer hover:border-emerald-400 transition flex flex-col justify-between">
                        ${content}
                    </div>
                `;
            }
        }

        function getLifeLabel(type) {
            const map = { remote: '💻リモート', holiday: '🌴休日', office: '🏢出社', event: '🔥イベント' };
            return map[type] || '🏢出社';
        }

        function selectDate(dateStr) {
            document.getElementById('log-date').value = dateStr;
            const logs = getStoredLogs();
            const found = logs.find(l => l.date === dateStr);
            const isFuture = new Date(dateStr) > new Date(getTodayStr());

            document.getElementById('form-title').innerText = isFuture ? `🔮 未来予定・服用計画の登録 [${dateStr}]` : `📝 日々のログ記録 [${dateStr}]`;

            if (found) {
                document.getElementById('log-lifestyle').value = found.lifestyle || 'office';
                document.getElementById('log-anxiety').value = found.finalAnxietyLevel || 2;
                document.getElementById('anxiety-val').innerText = found.finalAnxietyLevel || 2;
                document.getElementById('log-diarrhea').value = found.diarrheaSeverity || 1;
                document.getElementById('diarrhea-val').innerText = found.diarrheaSeverity || 1;
                document.getElementById('log-med-anxiety').checked = found.anxietyMedTaken !== undefined ? found.anxietyMedTaken : true;
                document.getElementById('log-med-kampo').checked = found.kampoIntake === 1;
                document.getElementById('log-med-probiotics').checked = found.probioticsIntake === 1;
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function getStoredLogs() {
            return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        }
        function saveLogs(logs) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(logs));
        }

        // データ管理
        function exportData() {
            const rawData = localStorage.getItem(STORAGE_KEY);
            if (!rawData || rawData === '[]') return alert('データがありません');
            const blob = new Blob([rawData], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `neuroguard_backup_${getTodayStr()}.json`;
            a.click();
        }

        function importData(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const logs = JSON.parse(evt.target.result);
                    if (Array.isArray(logs) && confirm('既存データを上書きして復元しますか？')) {
                        saveLogs(logs);
                        renderCalendar();
                        alert('復元完了しました。');
                    }
                } catch(err) { alert('不正なファイル形式です。'); }
            };
            reader.readAsText(file);
        }

        function clearAllData() {
            if (confirm('【警告】すべてのログデータを削除しますか？') && confirm('本当によろしいですか？')) {
                localStorage.removeItem(STORAGE_KEY);
                renderCalendar();
                alert('全データをクリアしました。');
            }
        }
    </script>
</body>
</html>
